<!--
  README banner. The mark is BRAND_MARK_PATH from src/lib/brand.ts, placed by
  hand: if the mark changes, paste the new path here as well as running
  `pnpm icons`. The type uses the reader's own fonts because an SVG shown
  as an image cannot load one, so the wordmark is left-aligned and given room
  to grow rather than measured.
-->
