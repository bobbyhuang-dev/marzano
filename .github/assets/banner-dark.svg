    <text x="366" y="178" font-size="96" font-weight="700" letter-spacing="-3.5" fill="#f5f5f5">Marzano</text>
    <text x="370" y="232" font-size="25" fill="#a6a6a6">Tasks, due reminders, tags, a calendar and a Pomodoro timer.</text>
