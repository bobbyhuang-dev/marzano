<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="description" content="A focused task list with due reminders, tags, and a built-in Pomodoro timer." />
    <title>Marzano</title>
    <!--
      All rendered from src/lib/brand.ts by `pnpm icons`. The SVG follows the
      colour scheme and is what Chrome and Firefox show; the ICO declares a size
      so that Chrome ranks it below the SVG instead of taking it first, and is
      what Safari and older browsers fall back to.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The theme has to be on the document before the first paint, or a dark-mode
      reader gets a white flash on every load; the accent and the display size
      are here for the same reason, or the page lays itself out twice. Mirrors
      src/lib/theme.ts and src/lib/appearance.ts, which take over once React
      mounts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("marzano.theme.v1");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#121212" : "#f7f7f7");

          // The colours themselves are in index.css, keyed by this attribute,
          // so the script only has to name the accent.
          document.documentElement.dataset.accent =
            localStorage.getItem("marzano.accent.v1") || "graphite";

          var zoom = Number(localStorage.getItem("marzano.zoom.v1"));
          if (zoom >= 80 && zoom <= 150 && zoom !== 100) {
            document.documentElement.style.fontSize = zoom + "%";
          }
        } catch (error) {
          // Storage can be blocked; the light default is already in the CSS.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
